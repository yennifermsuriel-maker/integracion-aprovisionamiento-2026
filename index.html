
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Integración Aprovisionamiento 2026</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app-container">

        <header class="encabezado">
            <div class="marca">Claro</div>

            <p class="direccion">
                APROVISIONAMIENTO DE SERVICIOS FIJOS
            </p>

            <h1>Actividad de integración 2026</h1>

            <p class="lema">
                Nuestros valores nos unen
            </p>
        </header>

        <section class="tarjeta consulta" id="consulta">

            <h2>Consulta tu equipo</h2>

            <p>Introduce tu número de tarjeta.</p>

            <form id="formConsulta">

                <label for="tarjeta">
                    Número de tarjeta
                </label>

                <input
                    type="text"
                    id="tarjeta"
                    inputmode="numeric"
                    pattern="[0-9]+"
                    placeholder="Escribe tu número"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="btnConsultar">
                    CONSULTAR
                </button>

            </form>

            <div id="mensaje" role="status" aria-live="polite"></div>

        </section>

        <section class="tarjeta resultado" id="resultado" hidden>

            <p class="bienvenida">
                ¡Bienvenido a nuestra integración!
            </p>

            <h2 id="nombreParticipante"></h2>

            <p id="departamentoParticipante"></p>

            <div class="equipo" id="tarjetaEquipo">

                <p id="tituloEquipo">TU EQUIPO ES</p>

                <h2 id="numeroEquipo"></h2>

                <h3 id="colorEquipo"></h3>

            </div>

            <div id="estadoAsistencia" role="status" aria-live="polite"></div>

            <button id="btnRegistrar" type="button">
                CONFIRMAR ASISTENCIA
            </button>

            <button id="btnNuevaConsulta" class="secundario" type="button">
                REALIZAR OTRA CONSULTA
            </button>

        </section>

        <footer>
            <p>Aprovisionamiento de servicios fijos</p>
            <p>Actividad de integración 2026</p>
        </footer>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
